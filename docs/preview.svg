<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">A desktop window on the left, its accessibility tree in the middle, and a pointer acting on one element on the right</title>
  <desc id="d">Illustration of how Computer Use works: the model observes a window, reads the accessibility tree of roles and names, then clicks one element by index or by screen pixel.</desc>

  <!-- window -->
  <rect x="40" y="66" width="196" height="168" rx="10" fill="none" stroke="#64748B" stroke-width="2"/>
  <path d="M40 96 H236" stroke="#64748B" stroke-width="2"/>
  <circle cx="56" cy="81" r="3.5" fill="#64748B"/>
  <circle cx="68" cy="81" r="3.5" fill="#64748B"/>
  <circle cx="80" cy="81" r="3.5" fill="#64748B"/>

  <!-- rows inside the window; the third one is the target -->
  <rect x="56" y="112" width="128" height="12" rx="6" fill="#94A3B8" opacity="0.45"/>
  <rect x="56" y="136" width="96" height="12" rx="6" fill="#94A3B8" opacity="0.45"/>
  <rect x="56" y="160" width="140" height="26" rx="7" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="64" y="169" width="72" height="8" rx="4" fill="#3B82F6" opacity="0.55"/>
  <rect x="56" y="200" width="112" height="12" rx="6" fill="#94A3B8" opacity="0.45"/>

  <!-- accessibility tree -->
  <path d="M300 150 H330" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="348" cy="150" r="18" fill="none" stroke="#64748B" stroke-width="2"/>
  <path d="M366 150 H392" stroke="#64748B" stroke-width="1.75"/>
  <path d="M392 108 V192" stroke="#64748B" stroke-width="1.75"/>

  <!-- tree leaves -->
  <path d="M392 108 H412" stroke="#64748B" stroke-width="1.75"/>
  <rect x="412" y="98" width="72" height="20" rx="6" fill="#94A3B8" opacity="0.35"/>
  <rect x="420" y="105" width="44" height="6" rx="3" fill="#64748B" opacity="0.8"/>

  <path d="M392 150 H412" stroke="#3B82F6" stroke-width="2"/>
  <rect x="412" y="138" width="96" height="24" rx="7" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="422" y="147" width="56" height="6" rx="3" fill="#3B82F6"/>

  <path d="M392 192 H412" stroke="#64748B" stroke-width="1.75"/>
  <rect x="412" y="182" width="72" height="20" rx="6" fill="#94A3B8" opacity="0.35"/>
  <rect x="420" y="189" width="40" height="6" rx="3" fill="#64748B" opacity="0.8"/>

  <!-- index badge on the highlighted leaf -->
  <circle cx="516" cy="126" r="11" fill="#3B82F6"/>
  <path d="M512 126 h8 M516 122 v8" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round"/>

  <!-- pointer acting on the highlighted row in the window -->
  <path d="M196 178 l0 26 l7 -7 l5 11 l6 -3 l-5 -11 l10 0 z" fill="#F59E0B" stroke="#78350F" stroke-width="1.25" stroke-linejoin="round"/>
  <circle cx="196" cy="178" r="15" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>

  <!-- screenshot frame corners around the window, suggesting a captured raster -->
  <path d="M32 58 h12 M32 58 v12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M244 58 h-12 M244 58 v12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 242 h12 M32 242 v-12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M244 242 h-12 M244 242 v-12" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
