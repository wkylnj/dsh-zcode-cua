# Two rows, two jobs.
#
# `zcode-cua` registers the stdio MCP server that actually drives the desktop:
# it spawns ZCode's `node-repl-host`, resolves the installed cua-helper, and
# turns Computer Use on by supplying the permission-broker environment the
# upstream server requires.
#
# `zcode-cua-access` is this package's own Host half (`index.js`). It holds the
# per-session switch: a tool guard that denies the `js` tool until the session
# opts in from the composer, plus the two small routes that switch reads and
# writes. The gate has to sit here rather than in the MCP server — a check
# inside the child process would still have started it, and the point is that a
# denied call never reaches the desktop at all.
#
# The `args` path is RELATIVE on purpose. It is resolved against the profile
# directory, where every profile-installed bundle lives at
# `node_modules/<package-name>`, so this file works on any machine without
# naming a checkout location.
#
# Running from a source checkout instead (a linked local install)? Local linked
# installs place the package under `node_modules/<package-name>` too, so the
# same relative path keeps working. If you cloned this repository somewhere and
# installed it by that directory, nothing here needs editing.
- insert:
    - id: zcode-cua-access
      name: 'dsh-zcode-cua'
    - id: zcode-cua
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: zcode-cua
        transport: stdio
        command: 'node'
        args:
          - 'node_modules/dsh-zcode-cua/server/index.js'
        env: {}
        cwd: ''
        toolCallTimeoutMs: 180000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
